<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recepção - SGA Pronto-Socorro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>SGA Pronto-Socorro</h1>
    <p>Sistema de Atendimentos de Pronto-Socorro</p>
  </header>

  <nav>
    <a href="index.html" class="ativo">Recepção</a>
    <a href="triagem.html">Triagem</a>
    <a href="painel.html">Painel médico</a>
  </nav>

  <main>
    <div id="mensagem"></div>

    <section class="caixa">
      <div class="topo-lista">
        <h2>Recepção - Atendimentos</h2>
        <a class="botao" href="cadastro.html">Novo atendimento</a>
      </div>

      <form class="busca" action="index.html" method="get">
        <input id="busca" type="search" name="busca" placeholder="Buscar por nome, CPF ou número do atendimento" aria-label="Buscar atendimento">
        <button class="botao" type="submit">Consultar</button>
      </form>

      <table>
        <thead>
          <tr>
            <th>Número</th>
            <th>Paciente</th>
            <th>CPF</th>
            <th>Nascimento</th>
            <th>Status</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="lista"></tbody>
      </table>
    </section>
  </main>
  <script src="js/comum.js"></script>
  <script src="js/recepcao.js"></script>
</body>
</html>
