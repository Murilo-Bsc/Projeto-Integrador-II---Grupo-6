<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Painel médico - SGA Pronto-Socorro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>SGA Pronto-Socorro</h1>
    <p>Sistema de Atendimentos de Pronto-Socorro</p>
  </header>

  <nav>
    <a href="index.html">Recepção</a>
    <a href="triagem.html">Triagem</a>
    <a href="painel.html" class="ativo">Painel médico</a>
  </nav>

  <main>
    <div id="mensagem"></div>

    <section class="caixa">
      <h2>Painel de atendimentos</h2>
      

      <div class="legenda">
        <span class="risco vermelho">Vermelho</span>
        <span class="risco laranja">Laranja</span>
        <span class="risco amarelo">Amarelo</span>
        <span class="risco verde">Verde</span>
        <span class="risco azul">Azul</span>
      </div>

      <table>
        <thead>
          <tr>
            <th>Número</th>
            <th>Paciente</th>
            <th>Nascimento</th>
            <th>Risco</th>
            <th>Queixa principal</th>
            <th>Chegada</th>
            <th>Ação</th>
          </tr>
        </thead>
        <tbody id="lista"></tbody>
      </table>
    </section>
  </main>
  <script src="js/comum.js"></script>
  <script src="js/painel.js"></script>
</body>
</html>
