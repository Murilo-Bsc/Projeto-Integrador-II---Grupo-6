<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atendimento médico - SGA Pronto-Socorro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>SGA Pronto-Socorro</h1>
    <p>Sistema de Atendimentos de Pronto-Socorro</p>
  </header>

  <nav>
    <a href="index.html">Recepção</a>
    <a href="triagem.html">Triagem</a>
    <a href="painel.html" class="ativo">Painel médico</a>
  </nav>

  <main>
    <div id="mensagem"></div>

    <section class="caixa">
      <h2>Atendimento médico - <span id="numero"></span></h2>

      <div class="dados">
        <p><strong>Paciente:</strong> <span id="nome"></span></p>
        <p><strong>Data de nascimento:</strong> <span id="nascimento"></span></p>
        <p><strong>Risco:</strong> <span id="risco" class="risco"></span></p>
        <p><strong>Queixas:</strong> <span id="queixas"></span></p>
        <p>
          <strong>Pressão:</strong> <span id="pressao"></span> |
          <strong>Temperatura:</strong> <span id="temperatura"></span> °C |
          <strong>Batimentos:</strong> <span id="batimentos"></span> bpm
        </p>
      </div>

      <form id="formulario">
        <label for="medicacoes">Medicações *</label>
        <textarea id="medicacoes" name="medicacoes" placeholder="Medicação, dose e via de administração" required></textarea>

        <label for="observacoes">Observações</label>
        <textarea id="observacoes" name="observacoes"></textarea>

        <div class="acoes">
          <button class="botao" type="submit">Confirmar atendimento</button>
          <a class="botao botao-cinza" href="painel.html">Voltar</a>
        </div>
      </form>
    </section>
  </main>
  <script src="js/comum.js"></script>
  <script src="js/atendimento.js"></script>
</body>
</html>
